name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formal-pins:
    # Reports, never fails: the proofs in soispoke/verified-shielded-pool cover
    # one pinned commit, and this lists the pinned files a change touches.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Report changes to formally verified files
        run: python tools/check_formal_pins.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install pinned dependencies
        run: |
          npm ci --prefix tools
          python -m pip install --requirement requirements.txt

      - name: Reject high dependency advisories
        run: npm audit --prefix tools --omit=dev --audit-level=high

      - name: Compile circuit
        run: |
          mkdir -p /tmp/shielded-pool-circuit
          tools/node_modules/.bin/circom2 core/circuits/spend.circom \
            --r1cs --wasm --sym -l tools/node_modules \
            -o /tmp/shielded-pool-circuit
          tools/node_modules/.bin/snarkjs r1cs info /tmp/shielded-pool-circuit/spend.r1cs
          cmp /tmp/shielded-pool-circuit/spend.r1cs core/artifacts/spend.r1cs
          cmp /tmp/shielded-pool-circuit/spend_js/spend.wasm core/artifacts/spend_js/spend.wasm

      - name: Check generated dispatcher bytecode
        run: |
          forge build --root core/contracts
          python tools/dispatcher.py --artifact >/dev/null
          git diff --exit-code -- core/artifacts/shielded_pool_dispatcher_init.hex
          python tools/dispatcher.py --initcode \
            0x0000000000000000000000000000000000000001 \
            0x0000000000000000000000000000000000000002 >/dev/null

      - name: Check Python and frame-vector code
        run: |
          python -m py_compile \
            tools/dispatcher.py sdk/frametx.py sdk/gas_profile.py \
            sdk/pool_frametx.py \
            test/test_pool_envelope_binding.py \
            test/test_gas_only_action.py \
            test/test_recent_root_window.py \
            test/test_occurrence_profile.py test/test_deploy_checks.py \
            test/test_occurrence.py \
            test/test_wallet_occurrence.py test/test_generators.py \
            sdk/disclosure.py test/test_disclosure.py \
            sdk/notes.py test/test_notes.py \
            sdk/gen_nonce_race.py sdk/gen_smoke.py sdk/wallet.py \
            tools/gen_poseidon_sol.py sdk/poseidon_bn254.py \
            tools/check_activation.py tools/check_forge_config.py tools/check_gas_profile.py \
            tools/check_formal_pins.py \
            test/test_check_activation.py \
            tools/patch_verifier.py
          python sdk/frametx.py
          python test/test_pool_envelope_binding.py
          python test/test_gas_only_action.py
          python test/test_recent_root_window.py
          python test/test_occurrence_profile.py
          python test/test_deploy_checks.py
          python test/test_occurrence.py
          python test/test_wallet_occurrence.py
          python test/test_generators.py
          python test/test_disclosure.py
          python test/test_notes.py
          python tools/check_gas_profile.py
          python tools/check_activation.py core/activation_manifest.testbed.json --allow-testbed
          python tools/check_forge_config.py core/activation_manifest.testbed.json core/contracts
          python test/test_check_activation.py
          python sdk/wallet.py
          python sdk/poseidon_bn254.py

      - name: Preserve historical deployment evidence
        run: |
          # The archived manifest names artifacts from before this circuit change.
          # Check that snapshot, without rewriting it to describe the new pool.
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          base = '6c5c77b171e08ad0987a06c44d0488ab385f36dd'
          archive = 'evidence/vectors/2026-09-01-hegota-final-profile'
          subprocess.run(['git', 'diff', '--exit-code', f'{base}:devnet/vectors/2026-09-01-hegota-final-profile', f'HEAD:{archive}'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', archive], check=True)
          manifest = json.loads(Path(archive, 'activation_manifest.testbed.json').read_text())
          for path, expected in manifest['artifacts'].items():
              data = subprocess.check_output(['git', 'show', f'{base}:{path}'])
              assert hashlib.sha256(data).hexdigest() == expected, path
          print('Historical artifact hashes match their original snapshot')
          PY

      - name: Test contracts
        working-directory: core/contracts
        run: |
          forge fmt --check
          forge lint --deny warnings
          # A preceding `forge build` can leave ABI-only test artifacts in
          # Foundry's cache. Force recompilation so test discovery cannot
          # silently collapse to a partial suite.
          forge test --force -vv

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lambdaclass/ethrex
          ref: 247e2dd2c4d4c526dcc64ac1c025bd2319e7a10e
          path: .native-ethrex
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install native test dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          npm ci --prefix tools
          python -m pip install --requirement requirements.txt
      - name: Test duplicate notes, reorgs, settlement gas and client policy
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/msp-occurrence-target
        run: python test/native/run.py --ethrex-source "$GITHUB_WORKSPACE/.native-ethrex"
