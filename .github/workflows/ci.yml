name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formal-pins:
    # Reports, never fails: the proofs in soispoke/verified-shielded-pool cover
    # one pinned commit, and this lists the pinned files a change touches.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Report changes to formally verified files
        run: python tools/check_formal_pins.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0

      - name: Install pinned dependencies
        run: just install

      - name: Reject high dependency advisories
        run: npm audit --prefix tools --omit=dev --audit-level=high

      # The checks themselves live in the justfile, so CI and `just test` run
      # the same list.
      - name: Check generated artifacts and the archived profile
        run: just check-artifacts

      - name: Python tests and checks
        run: just test-python

      - name: Test contracts
        run: just test-contracts

  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: lambdaclass/ethrex
          ref: 247e2dd2c4d4c526dcc64ac1c025bd2319e7a10e
          path: .native-ethrex
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install native test dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          npm ci --prefix tools
          python -m pip install --requirement requirements.txt
      - name: Test duplicate notes, reorgs, settlement gas and client policy
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/msp-occurrence-target
        run: python test/native/run.py --ethrex-source "$GITHUB_WORKSPACE/.native-ethrex"
